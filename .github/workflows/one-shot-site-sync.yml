name: One-shot site metadata sync

on:
  push:
    branches:
      - sol/site-stabilization-audit-20260916
    paths:
      - '.github/workflows/one-shot-site-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/site-stabilization-audit-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sync-metadata
      - name: Commit synchronized site metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-site-sync.yml
          git add index.html story.html manifesto.html library.html ecosystem.html contact.html studio.html posts script.js sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No metadata changes were required."
          else
            git commit -m "Synchronize GitHub Pages metadata"
            git push
          fi
