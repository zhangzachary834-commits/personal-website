name: One-shot site stabilization cleanup

on:
  push:
    branches:
      - sol/site-stabilization-audit-v2-20260919
    paths:
      - '.github/workflows/one-shot-site-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Regenerate deploy metadata
        run: npm run sync-metadata

      - name: Remove generated and stale working-tree artifacts
        run: |
          git rm -r --ignore-unmatch node_modules backup
          git rm --ignore-unmatch .DS_Store fix_parser.py scratch.js
          git rm --ignore-unmatch assets/favicon.jpg
          mkdir -p tools/perf
          if [ -f benchmark.js ]; then git mv benchmark.js tools/perf/legacy-physics-before.js; fi
          if [ -f benchmark2.js ]; then git mv benchmark2.js tools/perf/legacy-physics-after.js; fi

      - name: Remove this one-shot workflow after a successful run
        run: git rm .github/workflows/one-shot-site-cleanup.yml

      - name: Run unit and DOM tests
        run: npm test

      - name: Run structural site audit
        run: npm run audit

      - name: Run asset audit
        run: npm run audit:assets

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply verified site stabilization cleanup"
          git push
